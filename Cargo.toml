[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "crates/web"]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/lockejet/gocryptfs-ui"

# ---------- cargo-release ----------
# 注意：此处**刻意不配置** pre-release-hook。
# CHANGELOG.md 只在显式执行 `make changelog`（或 `make release` 的显式步骤）时生成，
# 因此 `make dry-run` / `cargo release --dry-run` 不会产生任何文件写入。
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "release: {{version}}"
publish = false
push-remote = "origin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

