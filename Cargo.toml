[package]
name = "gocryptfs-tui"
version = "0.5.1"          # 真实版本从 git tag 读取（build.rs）
edition = "2021"
description = "gocryptfs 加密卷管理 TUI + CLI"
license = "MIT"
repository = "https://github.com/lockejet/gocryptfs-tui"
build = "build.rs"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"

# ---------- cargo-release ----------
# 注意：此处**刻意不配置** pre-release-hook。
# CHANGELOG.md 只在显式执行 `make changelog`（或 `make release` 的显式步骤）时生成，
# 因此 `make dry-run` / `cargo release --dry-run` 不会产生任何文件写入。
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "release: {{version}}"
publish = false
push-remote = "origin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

