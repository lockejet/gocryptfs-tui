[package]
name = "gocryptfs-tui"
version = "0.1.0"          # 真实版本从 git tag 读取（build.rs）
edition = "2021"
description = "gocryptfs 加密卷管理 TUI + CLI"
license = "MIT"
repository = "https://github.com/lockejet/gocryptfs-tui"
build = "build.rs"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"

# ---------- cargo-release ----------
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "release: {{version}}"
publish = false
push-remote = "origin"
pre-release-hook = ["git", "cliff", "--tag", "v{{version}}", "-o", "CHANGELOG.md"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

